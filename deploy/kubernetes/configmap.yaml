apiVersion: v1
kind: ConfigMap
metadata:
  name: palingenesis-config
data:
  train.yaml: |
    # Replace the model and dataset before submitting a new Job.
    model:
      name_or_path: Qwen/Qwen3-0.6B
      trust_remote_code: false
      attn_implementation: sdpa
      torch_dtype: bfloat16
    data:
      dataset: /data/train.jsonl
      streaming: true
      max_seq_length: 4096
      num_workers: 4
    train:
      output_dir: /outputs/run-001
      resume_from: auto
      max_steps: 500
      per_device_batch_size: 2
      gradient_accumulation_steps: 8
      learning_rate: 2e-5
      gradient_checkpointing: selective
      optimizer: adamw
      bf16: true
      save_steps: 200
    memory:
      chunked_loss: true
      loss_num_chunks: 4
    logging:
      use_wandb: false
      use_trackio: false
